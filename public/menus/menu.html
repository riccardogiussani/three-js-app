<div id="vr-menu" style="
    /* Crucial: Ensure the root element has defined width and height */
    width: 300px;
    height: 200px; /* Added explicit height for safety */
    
    background: rgba(40, 44, 52, 0.9); 
    padding: 20px; 
    border-radius: 12px; 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    color: #FFF; 
    font-family: Arial, sans-serif;
    text-align: center;
    border: 2px solid #61AFEF;
">
    <h1 style="font-size: 24px; margin-bottom: 15px; color: #98C379;">VR Sandbox Menu</h1>
    <p style="font-size: 14px; margin-bottom: 20px; color: #ABB2BF;">
        Select an object with the trigger and grab it with the grip button.
    </p>
    <button onclick="console.log('Action 1 clicked!')" style="
        background-color: #56B6C2; 
        color: white; 
        border: none; 
        padding: 10px 20px; 
        margin: 5px;
        border-radius: 8px; 
        cursor: pointer;
        transition: background-color 0.2s;
    ">
        Action 1
    </button>
    <button onclick="console.log('Action 2 clicked!')" style="
        background-color: #E06C75; 
        color: white; 
        border: none; 
        padding: 10px 20px; 
        margin: 5px;
        border-radius: 8px; 
        cursor: pointer;
        transition: background-color 0.2s;
    ">
        Action 2
    </button>
</div>
